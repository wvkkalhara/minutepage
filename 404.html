  .sweep{transform-box:view-box;transform-origin:120px 120px;animation:sweep 60s linear infinite}

  .n{position:absolute;inset:0;display:grid;place-items:center;font-family:'Syne','Syne Fallback',sans-serif;font-weight:800;font-size:clamp(4rem,19vw,6.5rem);line-height:1;letter-spacing:-.05em;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}

  .btn:active{transform:scale(.97)}
  .btn.primary{background:var(--grad);color:#02120D;box-shadow:0 0 0 1px rgba(255,255,255,.14) inset,0 10px 30px -10px rgba(6,182,212,.6)}
  .btn.ghost{background:rgba(255,255,255,.04);border-color:var(--line2);color:var(--tx)}
  @media (hover:hover){.btn.primary:hover{transform:translateY(-2px);box-shadow:0 0 0 1px rgba(255,255,255,.22) inset,0 16px 36px -10px rgba(16,185,129,.7)}.btn.ghost:hover{background:rgba(255,255,255,.09);transform:translateY(-1px)}}
  a:focus-visible{outline:2px solid #22D3EE;outline-offset:3px;border-radius:.8rem}
  @media (prefers-reduced-motion:reduce){.sweep{animation:none}.btn{transition:none}}
</style>
